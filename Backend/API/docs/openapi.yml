        "401":
          $ref: "#/components/responses/Error"

  /api/v1/packages:
    get:
      tags: [Networker (JWT)]
      summary: List active packages (public tiers for dashboard / renew)
      description: |
        Returns all **ACTIVE** packages sorted for display (use `sort_order`, then amount).
        Amounts and `daily_binary_cap` are in **paise**. Same rows power **Add Member** package pickers.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Package array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/packages/renew:
    post:
      tags: [Networker (JWT)]
      summary: Renew/upgrade package for current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: { type: string }
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/admin/config/packages:
    get:
      tags: [Admin (JWT)]
      summary: List packages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Admin (JWT)]
      summary: Create package
      description: |
        Creates a new package tier. Packages now only control `daily_binary_cap`
        (v2: lifetime cap multipliers have been removed).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, amount, daily_binary_cap, sort_order]
              properties:
                name: { type: string }
                amount: { type: integer, description: Amount in paise }
                daily_binary_cap:
                  type: integer
                  description: Paise — max binary income per calendar day for users on this tier. 0 = no daily cap.
                sort_order: { type: integer }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/admin/config/packages/{id}:
