                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/admin/payouts/{id}/approve:
    post:
      tags: [Admin (JWT)]
      summary: Approve payout request
      security:
