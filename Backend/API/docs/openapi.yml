      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                amount: { type: integer, description: Paise }
                daily_binary_cap: { type: integer, description: "Paise — 0 = no daily cap" }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                sort_order: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
