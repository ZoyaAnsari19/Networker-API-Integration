openapi: 3.0.3
info:
  title: FMCG-Binary API
  version: 1.0.10
  description: |
    API for the FMCG-Binary MLM commission platform.

    **v2 changes (April 2026):**
    - Lifetime income caps (`max_direct_cap`, `max_binary_cap`) removed entirely.
    - Packages now only control `daily_binary_cap` (daily binary ceiling per user).
    - Monthly shopping gate introduced: if a networker's cumulative monthly income
      exceeds ₹25,000 (2,500,000 paise) they must spend ₹2,500+ (250,000 paise) on
      Secure-Mart products in the same month. Credits earned while the gate is open
      are quarantined in `held_income` (HELD) and released atomically once the
      shopping condition is met. Unmet balances are forfeited at month rollover.
    - `/me` profile now includes `monthly_income_paise`, `monthly_shopping_paise`,
      `income_period_ym`.
    - Package activation: `topped_up` action removed; only `activated`, `upgraded`,
      `none` are possible.

    Auth models:
    - Networker/Admin APIs use JWT (`Authorization: Bearer <token>`).
    - FMCG platform APIs use API key auth (`X-API-Key`, `X-API-Secret`).

    Sponsor identifier:
    - `sponsor_id` is the **human sponsor code** like `SPF00001`.
    - For backward-compatibility, some endpoints may also accept a UUID `user_id` in `sponsor_id` and will resolve it.

servers:
  - url: http://localhost:3100

tags:
  - name: Health
  - name: Auth
  - name: FMCG (API Key)
  - name: Networker (JWT)
  - name: Admin (JWT)
  - name: Profile
  - name: KYC
  - name: P2P

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login (networker or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/users/register:
    post:
      tags: [FMCG (API Key)]
      summary: Register networker user from FMCG platform
      security:
        - fmcgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FMCGRegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/users/sync:
    post:
      tags: [FMCG (API Key)]
      summary: Sync user profile from FMCG to Binary
      security:
        - fmcgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncRequest"
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/users/lookup:
    get:
      tags: [FMCG (API Key)]
      summary: Look up a networker by email, phone, sponsor_id, or user_id
      description: |
        Returns a combined snapshot (profile + current package + sponsor +
        wallets + KYC + placement + recent directs) for a networker. Intended
        for FMCG support consoles and checkout flows that otherwise have to
        stitch together `/users/:userId/check` + `/me` + other calls.

        Exactly **one** query parameter must be supplied. Multiple or missing
        parameters return `400`.

        Identifier normalisation:
        - `email` is lower-cased before lookup.
        - `sponsor_id` is upper-cased (SPF codes are stored upper-case).
        - `phone` is matched verbatim, including the country-code prefix.
        - `user_id` is the Binary UUID (`networker_users.user_id`).
      security:
        - fmcgApiKey: []
      parameters:
        - in: query
          name: email
          required: false
          schema: { type: string, format: email }
          example: ravi@example.com
        - in: query
          name: phone
          required: false
          schema: { type: string }
          example: "+919876543210"
        - in: query
          name: sponsor_id
          required: false
          schema: { type: string }
          example: SPF00001
        - in: query
          name: user_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User lookup snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserLookupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/purchase:
    post:
      tags: [FMCG (API Key)]
      summary: Process purchase event, distribute commissions, and record shopping
      description: |
        Single entry point for all Secure-Mart purchase events. For each call:

        1. **BV distribution** — BV is distributed up the binary tree; pair matches and level
           bonuses are calculated at each ancestor and credited to their team wallets (subject
           to daily binary cap; excess is forfeited, not deferred).
        2. **Direct / franchise commission** — sponsor earns 10% of BV (configurable).
           Franchise commission applies when the buyer is under a franchise node.
        3. **Monthly shopping gate (v2)** — all commission credits above pass through the
           activation rule. If the recipient's cumulative monthly income has already crossed
           ₹25,000 and they have NOT yet shopped ₹2,500 this month, the credit is quarantined
           in `held_income` (HELD) rather than written to the wallet ledger. Credits are
           released atomically once the shopping condition is satisfied.
        4. **Package auto-activation** — for `user_type=networker`, the purchase amount is
           matched against package tiers and the user is activated/upgraded if applicable
           (see `/fmcg/packages/process`).
        5. **Shopping counter update** — for `user_type=networker` with `total_amount > 0`,
           the buyer's `monthly_shopping_paise` counter is incremented. If crossing ₹2,500
           in the same call, any HELD income rows for the current month are released
           immediately.

        Response `data` shape includes:
        - `commission_result` — direct, binary, franchise, level details (each with `held` flag).
        - `package_activation` — `PackageActivationResult` (for networker buyers).
        - `shopping` — `ShoppingResult` (for networker buyers with `total_amount > 0`).

        Idempotent on `order_id` — replaying the same order_id is a no-op.
      security:
        - fmcgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseEvent"
      responses:
        "200":
          description: Purchase processed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessAnyResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          commission_result:
                            type: object
                            description: Per-source commission outcomes (direct, binary, franchise, level).
                            properties:
                              direct:
                                type: object
                                properties:
                                  amount: { type: integer, format: int64 }
                                  held: { type: boolean }
                                  held_amount: { type: integer, format: int64 }
                              binary:
                                type: object
                                properties:
                                  amount: { type: integer, format: int64 }
                                  held: { type: boolean }
                                  held_amount: { type: integer, format: int64 }
                              franchise:
                                type: object
                                properties:
                                  amount: { type: integer, format: int64 }
                                  held: { type: boolean }
                                  held_amount: { type: integer, format: int64 }
                          package_activation:
                            $ref: "#/components/schemas/PackageActivationResult"
                          shopping:
                            $ref: "#/components/schemas/ShoppingResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/users/{userId}/check:
    get:
      tags: [FMCG (API Key)]
      summary: Check a user on Binary (is_networker, status, package)
      security:
        - fmcgApiKey: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/packages/match:
    get:
      tags: [FMCG (API Key)]
      summary: Read-only lookup — best-fit package tier for a given amount
      description: |
        Returns the highest-value ACTIVE package whose `amount <= amount` query
        parameter, or `matched=false` if no tier fits. Safe to call before a
        purchase (e.g. cart preview). No state changes.
      security:
        - fmcgApiKey: []
      parameters:
        - in: query
          name: amount
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Purchase amount in paise
      responses:
        "200":
          description: Match result (either a package or `matched=false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/fmcg/packages/process:
    post:
      tags: [FMCG (API Key)]
      summary: Auto-activate / upgrade a networker's package by purchase amount
      description: |
        Called by FMCG whenever a networker makes a Secure-Mart purchase.
        Applies the following rules (v2 — lifetime caps removed):

        1. **Amount below smallest tier** → `action = "none"` (no changes).
        2. **No current package** on user → `action = "activated"` — package assigned,
           `daily_binary_cap` set to the matched tier's cap, user status → ACTIVE.
        3. **Matched tier is HIGHER than current** → `action = "upgraded"` — `current_package_id`
           switches to the higher tier, `daily_binary_cap` updated to the higher tier's value.
        4. **Matched tier ≤ current** → `action = "none"` — no changes (there are no lifetime
           caps to extend, so a same-tier or lower-tier purchase is a no-op for package state).
        5. **User is not a networker** → `action = "none"`.

        Note: `/api/v1/fmcg/purchase` invokes this flow automatically for `user_type = "networker"`
        purchases, so callers typically do not need to hit this endpoint directly.
      security:
        - fmcgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageProcessRequest"
      responses:
        "200":
          description: Activation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Networker (JWT)]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserProfileResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/wallets:
    get:
      tags: [Networker (JWT)]
      summary: Get wallet balances
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/wallets/{type}/ledger:
    get:
      tags: [Networker (JWT)]
      summary: Get ledger entries for wallet type
      description: |
        Paginated list (`success`, `data`, `meta`). Amounts are in **paise**; `amount` is always positive — use `entry_type` (`CREDIT` | `DEBIT`) for direction.

        **Wallet page:** merge `DIRECT` and `TEAM` ledgers (e.g. `limit=100` each).

        **Income page (`/income`):** client filters **CREDIT** rows by `source`:
        - **Direct tab:** `type=DIRECT` and `source` in `DIRECT_COMMISSION`, `FRANCHISE_COMMISSION`
        - **Binary tab:** `type=TEAM` and `source=BINARY_MATCH`
        - **Level tab:** `type=TEAM` and `source=LEVEL_BONUS`  
        Withdrawals, P2P, and admin rows use other `source` values and are excluded from those tabs.
        Summary cards and tables use the same rules, filtered by a **date range** on the client (`created_at`).
        Fetch **all pages** (`meta.total_pages`, `limit=100`) per wallet so “All time” sums stay complete up to API limits.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [DIRECT, TEAM]
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated ledger rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLedgerEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/tree:
    get:
      tags: [Networker (JWT)]
      summary: Get binary tree (current user)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/commissions:
    get:
      tags: [Networker (JWT)]
      summary: List commissions (current user)
      description: |
        **Stub:** returns paging metadata and a note to use `GET /api/v1/wallets/{DIRECT|TEAM}/ledger`
        for commission-line history. The User app **Income** screen uses wallet ledgers (paged) with client date-range filters.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stub response (prefer wallet ledgers for income UI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/avatar:
    post:
      tags: [Networker (JWT)]
      summary: Upload profile photo (multipart field `file`, JPEG/PNG)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/payout-upi:
    post:
      tags: [Networker (JWT)]
      summary: Set payout UPI id (login password re-auth)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payout_upi_id, login_password]
              properties:
                payout_upi_id:
                  type: string
                login_password:
                  type: string
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/team:
    get:
      tags: [Networker (JWT)]
      summary: List downline on LEFT or RIGHT leg
      description: |
        Returns every descendant on the chosen leg (LEFT or RIGHT) relative to
        the authenticated networker — not just direct referrals. Each row
        includes the member's own `volume` (left_bv + right_bv flowing under
        their node), whether they are a direct sponsored user (`is_direct`),
        their depth from the caller, active package name and join date. Used
        by the My Team page (/team) to populate the left/right team tabs.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: side
          required: true
          schema: { type: string, enum: [LEFT, RIGHT] }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Team members list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessAnyResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          side: { type: string, enum: [LEFT, RIGHT] }
                          count: { type: integer }
                          members:
                            type: array
                            items:
                              $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/team/stats:
    get:
      tags: [Networker (JWT)]
      summary: Team summary stats (both legs combined)
      description: |
        Aggregates the caller's entire downline: total members, active members,
        new members joined in the last 7 days, left/right member counts and
        left/right BV volumes (read from the caller's own `binary_tree` row).
        Used by the header cards on the /team page.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Team stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessAnyResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TeamStatsView"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/referrals:
    get:
      tags: [Networker (JWT)]
      summary: List my direct referrals (sponsored downline)
      description: |
        Returns networker users whose sponsor is the caller, along with each
        referral's current placement leg (LEFT/RIGHT), placement status
        (PLACED / PENDING_PLACEMENT), status, active package name and
        current-month income (`total_direct_earned` field, kept for backward
        compatibility — value is now monthly, not lifetime). Used by the Invite & Earn page.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Direct referrals list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessAnyResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DirectReferral"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/users/create:
    post:
      tags: [Networker (JWT)]
      summary: Create a new networker under current user (dashboard create)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/payouts/schedule:
    get:
      tags: [Networker (JWT)]
      summary: Withdrawal schedule (IST window, allowed calendar days, fee percents)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schedule for withdraw UI
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessAnyResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          server_now_ist:
                            type: string
                          ist_start_hour:
                            type: integer
                          ist_end_hour:
                            type: integer
                          within_time_window:
                            type: boolean
                          min_withdrawal_paise:
                            type: integer
                          service_charge_percent:
                            type: number
                          tds_percent:
                            type: number
                          allowed_dates_direct:
                            type: array
                            items:
                              type: integer
                          allowed_dates_team:
                            type: array
                            items:
                              type: integer
                          today_allowed_for_direct:
                            type: boolean
                          today_allowed_for_team:
                            type: boolean
                          max_percent_of_monthly_income:
                            type: integer
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/payouts/request:
    post:
      tags: [Networker (JWT)]
      summary: Request payout (withdrawal)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_type, amount, transaction_password]
              properties:
                wallet_type:
                  type: string
                  enum: [DIRECT, TEAM]
                amount:
                  type: integer
                  description: Amount in paise (gross)
                transaction_password:
                  type: string
                payment_method:
                  type: string
                  description: Optional; defaults to SECURE_WALLET (only supported value).
                  enum: [SECURE_WALLET]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/payouts:
    get:
      tags: [Networker (JWT)]
      summary: List payout requests (current user)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated payout list
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/placement-requests:
    get:
      tags: [Networker (JWT)]
      summary: List pending placement requests for current user (as sponsor)
      description: |
        Returns placement requests where the logged-in user is the sponsor.
        Only PENDING requests are shown. The sponsor must decide left/right
        placement within 48 hours, after which the system auto-places on the
        weaker subtree.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Placement requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAnyResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/placement-requests/{id}/decide:
    post:
      tags: [Networker (JWT)]
      summary: Decide placement leg for a pending request
      description: |
        The sponsor chooses LEFT or RIGHT for the pending user. The user is
        immediately placed in the binary tree and any held binary BV is
        replayed through DistributeBVAndMatch for all uplines.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
